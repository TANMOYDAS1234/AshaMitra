name: asha_mitra
description: ASHA Mitra - Voice AI for Safer Care
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  shared_preferences: ^2.2.2
  http: ^1.1.0
  # Push. Deliberately WITHOUT flutter_local_notifications: Android already
  # renders notifications itself when the app is backgrounded or closed (which
  # is when a RED alert actually matters). Foreground messages are shown as an
  # in-app banner instead — one less dependency, and a smaller APK.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  intl: ^0.20.2
  dio: ^5.4.0
  connectivity_plus: ^7.1.1
  permission_handler: ^12.0.1
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.4
  open_file: ^3.3.2
  speech_to_text: ^7.0.0
  video_player: ^2.9.2
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  crypto: ^3.0.3
  sqflite: ^2.3.3
  uuid: ^4.4.0
  geolocator: ^14.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  package_info_plus: ^9.0.1
  # Audio recording for Groq Whisper transcription path. The
  # speech_to_text plugin's Android SpeechRecognizer turned out to be
  # unreliable on Infinix HiOS (audio session race between turns), so
  # we record raw audio with `record` and send it to backend
  # /api/transcribe → Groq Whisper API. Whisper has excellent Bengali
  # support and Groq is fast (~500 ms-2 s typical).
  record: ^6.0.0
  # On-device live QR scanner for Aadhaar Secure-QR (point-and-lock, far more
  # reliable than photographing the whole card). Pulls androidx.camera +
  # Google ML Kit barcode — needs uninspected HTTPS to Google Maven.
  mobile_scanner: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/ashalogo.png"
  min_sdk_android: 23
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/images/ashalogo.png"
  web:
    generate: true
    image_path: "assets/images/ashalogo.png"
    background_color: "#4F46E5"
    theme_color: "#4F46E5"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/cases/
    - assets/images/visits/
    - assets/video/
    - assets/illustrations/
    - assets/data/
    # assets/guidelines/ — 121 MB of reference PDFs, NOT referenced anywhere in
    # the app. Unbundled to keep the APK small (files kept in repo for a future
    # download-on-demand guidelines library). Re-add this line to bundle them.
    - assets/voices/
    - assets/fonts/
  fonts:
    - family: SolaimanLipi
      fonts:
        - asset: assets/fonts/SolaimanLipi.ttf

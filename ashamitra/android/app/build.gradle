plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // Reads android/app/google-services.json at build time. The file is
    // gitignored, so a clean clone must drop it in before building.
    id "com.google.gms.google-services"
}

android {
    namespace "com.example.asha_mitra"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.example.asha_mitra"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    // Skip release lint entirely on this Windows build host. Lint pulls
    // in a separate dependency subgraph (profileinstaller, startup-
    // runtime, etc.) that the SSL-inspection block prevents from being
    // resolved. Lint is static analysis only — it does not affect
    // runtime correctness, so it's safe to skip for installable APKs
    // produced here. CI / another build host with normal network can
    // run lint instead.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// Belt-and-braces: even if lint is configured off above, the AGP task
// graph still wires `generateReleaseLintModel` into ProcessReleaseRes
// for some plugins (notably audioplayers_android). Manually skip the
// whole release lint chain across all subprojects so they don't pull
// in the unfetchable transitive AARs.
subprojects {
    afterEvaluate {
        tasks.matching { it.name.toLowerCase().contains('lint') }.configureEach {
            enabled = false
        }
    }
}

flutter {
    source '../..'
}
